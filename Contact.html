<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width,initial scale=1.0">
        <title>Contact</title>
    </head>
    <body>
        <form>
            <h1>Contact Me</h1>
            <hr>
            <h2>Get in Touch:</h2>
            <form action="/login" method="post">
            <label for="name">
                Name:
           
                <input type="text" name="username"id="name" required
                placeholder="Please enter your name.">
            </label>
            <br>
            <br>
            <label for="email">
                Email:
                
               <input type="email" name="email" id="email"required placeholder="Please enter your email.">
            </label>
            
            <br>
            <br>
            <label for="contact">
                contact:
                <input type="number" name="Contact" id="contact" required placeholder="Please enter your contact.">
            </label>
            <br>
            <br>
            <label for="">Date of Birth:</label>
            <input type="date" name="" id="dob">
            <br>
            <br>
            
            
            <label for="city">City:</label>
            <select name="" id="city">
                <option value="">Delhi</option>
                <option value="">Mumbai</option>
                <option value="">Banglore</option>
                <option value="">Chennai</option>
                <option value="">Kolkata</option>
                <option value="">Rajasthan</option>
                <option value="">Uttar Pradesh</option>
                <option value="">Jammu and Kashmir</option>
                <option value="">west Bengal</option>
            </select>
            <br>
            <br>
            <label for="Message">Message</label>
            <textarea name="" id="Message" rows="10" cols="40"></textarea>
            <br>
            <br>
            <button type = "reset">Reset</button>
            <button type="submit">Submit</button>

        </form>
    </body>
  </html>
